<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Favicons — MONVEX brand icon ── -->
    <!-- Primary: SVG (modern browsers, scales perfectly at any size) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fallback: PNG at common sizes -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <!-- Apple touch icon for iOS home screen / bookmarks -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />

    <title>MONVEX — Move Money. Maintain Trust.</title>

    <!--
      Inter is the primary typeface for MONVEX.
      We load only the weights we actually use: 400, 500, 600, 700.
      display=swap prevents invisible text during font load.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
