<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      MONVEX favicons — generated from the official brand PNG.

      REQUIRED FILES in frontend/public/:
        monvex-logo.png        — the original brand PNG asset
        favicon-32.png         — 32x32 crop/resize of monvex-logo.png
        favicon-16.png         — 16x16 crop/resize of monvex-logo.png
        apple-touch-icon.png   — 180x180 for iOS home screen

      The SVG favicon.svg may be kept as a fallback but the PNG is primary.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />

    <title>MONVEX — Move Money. Maintain Trust.</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
